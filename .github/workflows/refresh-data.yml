name: Refresh contest data

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # workflow_dispatch redeploy (GITHUB_TOKEN pushes do not trigger on.push)

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Pull WA7BNM calendar + rebuild feeds
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run data

      # refresh.ts already refuses empty parses / dropped CW rows; re-run unit coverage too.
      - name: Verify no CW events dropped
        run: npm test

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "contest-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/contests.json public/feed.xml public/cw-contests.ics
          if git diff --staged --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh contest feed"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Bot pushes with GITHUB_TOKEN do not fire deploy.yml's on.push — redeploy explicitly.
      - name: Redeploy Pages
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
